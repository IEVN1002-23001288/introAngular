<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        
                        <div class="form-group pt-4">
                            <label for="num1">Número 1</label>
                            <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese número 1">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num1">Número 2</label>
                            <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num1" placeholder="Ingrese número 2">
                        </div>
                        <br>
                        
                        
                        <div class="form-check">
                            <input [(ngModel)]="operacion" value="triangulo" class="form-check-input" type="radio" name="radioDefault" id="sumar">
                            <label class="form-check-label" for="radioDefault1">
                                triangulo 
                            </label>
                        </div>
                        <div class="form-check">
                            <input [(ngModel)]="operacion" value="rectangulo" class="form-check-input" type="radio" name="radioDefault" id="restar" checked>
                            <label class="form-check-label" for="radioDefault2">
                                rectangulo 
                            </label>
                        </div>
                        <div class="form-check">
                            <input [(ngModel)]="operacion" value="circulo" class="form-check-input" type="radio" name="radioDefault" id="multiplicar" checked>
                            <label class="form-check-label" for="radioDefault2">
                                circulo 
                            </label>
                        </div>
                        <div class="form-check">
                            <input [(ngModel)]="operacion" value="pentagono" class="form-check-input" type="radio" name="radioDefault" id="dividir" checked>
                            <label class="form-check-label" for="radioDefault2">
                                pentagono 
                            </label>
                        </div>
                        
                        
                        <button (click)="calcular()" type="button" class="btn btn-primary">
                            Calcular
                        </button>




                    </form>
                </div>
                <div class="col-6">
                    <h3>Resultado: {{resultado}} </h3>
                </div>
            </div>




        </div>
    </div>
</body>
</html>
